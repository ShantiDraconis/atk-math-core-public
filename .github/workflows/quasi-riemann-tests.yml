name: Quasi-Riemann reproducibility tests

on:
  push:
    paths:
      - "research/riemann/bicomplex-riemann-formalization/Tests/**"
      - ".github/workflows/quasi-riemann-tests.yml"
  pull_request:
    paths:
      - "research/riemann/bicomplex-riemann-formalization/Tests/**"
      - ".github/workflows/quasi-riemann-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r research/riemann/bicomplex-riemann-formalization/Tests/requirements-tests.txt
      - name: Run exact and numerical checks
        run: python -m unittest discover -s research/riemann/bicomplex-riemann-formalization/Tests -p "test_*.py" -v
